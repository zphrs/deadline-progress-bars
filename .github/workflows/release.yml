name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Created from the selected ref if it doesn't exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    # Preview image; macos-26 only ships Xcode 26, which can't compile Icon.icon.
    runs-on: xcode-27
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DMG: build/DeadlineProgressBars.dmg
      APP: build/Build/Products/Release/Deadline Progress Bars.app
      BUNDLE_ID: dev.zphrs.DeadlineProgress
      # Every release must be signed by the same Apple Development identity. The app's
      # keychain items and sandbox container are bound to its designated requirement,
      # which pins the bundle ID and the certificate's common name. Renewed certificates
      # keep the same name, so updates keep access to the saved Notion token.
      TEAM_ID: 7DAR7MF3X3
      SIGNER_ID: VPQQU6MQ9Y
    steps:
      - name: Check signing secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD; do
            [[ -n "${(P)name}" ]] || missing+=("$name")
          done
          if (( ${#missing} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. Releases must be signed with the Apple Development certificate."
            exit 1
          fi
        shell: zsh {0}

      - uses: actions/checkout@v4

      # Icon.icon is authored in Xcode 27's Icon Composer; older actool versions crash on it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require Xcode 27 or newer
        run: |
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')"
          if (( MAJOR < 27 )); then
            echo "::error::Xcode $MAJOR can't compile Icon.icon. Installed versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development: .*($SIGNER_ID)"; then
            echo "::error::Certificate is not the Apple Development identity ($SIGNER_ID) that previous releases were signed with."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi

      - name: Build DMG
        run: |
          scripts/make-dmg.sh MARKETING_VERSION="${TAG#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="Apple Development" DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          REQ="$(codesign -d -r- "$APP" 2>&1)"
          echo "$REQ"
          # The designated requirement is what keychain ACLs and the sandbox container check.
          grep -q "identifier \"$BUNDLE_ID\"" <<<"$REQ" || { echo "::error::Unexpected bundle identifier"; exit 1; }
          grep -q "certificate leaf\[subject.CN\] = \"Apple Development: .*($SIGNER_ID)\"" <<<"$REQ" \
            || { echo "::error::Designated requirement is not pinned to Apple Development ($SIGNER_ID)"; exit 1; }
          codesign -d --entitlements - --xml "$APP" | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::Sandbox entitlement missing"; exit 1; }

      - name: Rename DMG with version
        run: |
          OUT="build/DeadlineProgressBars-${TAG#v}.dmg"
          mv "$DMG" "$OUT"
          echo "DMG=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Heredoc into a file, not $(...): macOS bash 3.2 misparses quotes inside heredocs in command substitutions.
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<'EOF'
          Download the DMG, open it, and drag **Deadline Progress Bars** into Applications.

          This app isn't notarized by Apple, so macOS blocks it the first time you open it. To allow it:
          1. Open the app once and dismiss the warning.
          2. Go to **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.

          Or run this in Terminal:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Deadline Progress Bars.app"
          ```
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "$TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
